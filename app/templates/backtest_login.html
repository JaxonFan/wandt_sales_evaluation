<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&T Sales Scorecard · Login</title>
<style>
  :root{--paper:#F6F7F8;--ink:#18201C;--muted:#727C77;--line:#EBEDEC;--line-2:#E1E4E3;--accent:#5A48B6;--accent-2:#46379A;--accent-soft:#EFEBFA}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--paper);color:var(--ink);
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 34px;width:360px;box-shadow:0 8px 30px rgba(20,30,24,.08)}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0 0 2px} .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;letter-spacing:.02em}
  input{width:100%;box-sizing:border-box;font-size:15px;padding:10px 12px;margin:0 0 14px;border:1px solid var(--line-2);border-radius:10px;background:#fff}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{width:100%;padding:11px;border:none;background:var(--accent);color:#fff;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
  button:hover{background:var(--accent-2)}
  .err{background:#FBEAEA;color:#C43D3D;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
</style></head><body>
<form class="card" method="post" action="/login">
  <div class="brand">W&T Scorecard</div>
  <p class="sub">Sales incentive · 销售奖金</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="u">Username · 用户名</label>
  <input id="u" name="username" autocomplete="username" required>
  <label for="p">Password · 密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in · 登录</button>
</form>
</body></html>
