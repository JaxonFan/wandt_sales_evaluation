<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&T Sales Scorecard · Login</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:#1f2733;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border:1px solid #e6ebf1;border-radius:14px;padding:30px 34px;width:340px}
  h1{font-size:19px;margin:0 0 4px} .sub{color:#6b7785;font-size:13px;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;font-size:15px;padding:10px 12px;margin:6px 0 12px;border:1px solid #e6ebf1;border-radius:8px}
  button{width:100%;padding:11px;border:none;background:#2b6cb0;color:#fff;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  .err{background:#fceaea;color:#d63b3b;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
</style></head><body>
<form class="card" method="post" action="/login">
  <h1>W&T Sales Scorecard</h1>
  <p class="sub">Profit-growth model · 销售记分卡</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="username" autocomplete="username" required>
  <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
</body></html>
