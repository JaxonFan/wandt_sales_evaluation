version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin "$ECR_URI"
  build:
    commands:
      - docker build --build-arg BUILD_VERSION="$(cat VERSION 2>/dev/null || echo dev)" -t "$ECR_URI:latest" .
  post_build:
    commands:
      - docker push "$ECR_URI:latest"
